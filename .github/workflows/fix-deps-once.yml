name: Fix dependencies once

on:
  push:
    branches: [ agent/fix-ci-node-audit ]

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-node-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm install --package-lock-only
      - run: npm audit fix --package-lock-only
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "fix: update audited dependencies"
            git push origin HEAD:agent/fix-ci-node-audit
          fi
